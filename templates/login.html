<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #10141b;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 360px;
            background: #1a2029;
            padding: 30px;
            border-radius: 8px;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            margin-top: 5px;
            background: #212836;
            border: 1px solid #2c3340;
            color: white;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #ffb627;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .erro {
            color: #e2685c;
        }

        a {
            color: #ffb627;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Entrar</h1>

    {% if mensagem %}

        <p class="erro">
            {{ mensagem }}
        </p>

    {% endif %}

    <form method="POST">

        <label for="email">
            E-mail
        </label>

        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <label for="senha">
            Senha
        </label>

        <input
            type="password"
            id="senha"
            name="senha"
            required
        >

        <button type="submit">
            Entrar
        </button>

    </form>

    <p>
        Ainda não possui conta?

        <a href="{{ url_for('cadastro') }}">
            Criar conta
        </a>
    </p>

</div>

</body>

</html>
