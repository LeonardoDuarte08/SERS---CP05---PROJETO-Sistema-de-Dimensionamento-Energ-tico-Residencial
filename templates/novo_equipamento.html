<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Adicionar Equipamento</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0d131b;
            color: white;
        }

        .container {
            width: 500px;
            max-width: calc(100% - 40px);
            margin: 60px auto;
            background: #19212c;
            border: 1px solid #2c3746;
            border-radius: 10px;
            padding: 30px;
        }

        h1 {
            margin-top: 0;
        }

        p {
            color: #94acd2;
        }

        label {
            display: block;
            margin-top: 18px;
            color: #94acd2;
        }

        select,
        input {
            width: 100%;
            box-sizing: border-box;
            margin-top: 6px;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #2c3746;
            background: #111925;
            color: white;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #ffb627;
            border: 0;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .erro {
            color: #ee6d63;
        }

        .voltar {
            display: inline-block;
            margin-top: 20px;
            color: #ffb627;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>
        Adicionar equipamento
    </h1>

    <p>
        Residência: {{ residencia.nome }}
    </p>

    {% if mensagem %}

        <p class="erro">
            {{ mensagem }}
        </p>

    {% endif %}

    <form method="POST">

        <label for="equipamento">
            Equipamento
        </label>

        <select
            id="equipamento"
            name="equipamento"
            required
        >

            <option value="">
                Selecione
            </option>

            {% for equipamento in equipamentos_disponiveis %}

                <option value="{{ equipamento.nome }}">
                    {{ equipamento.nome }}
                    - {{ equipamento.potencia_w }} W
                </option>

            {% endfor %}

        </select>

        <label for="quantidade">
            Quantidade
        </label>

        <input
            type="number"
            id="quantidade"
            name="quantidade"
            min="1"
            placeholder="Ex: 1"
            required
        >

        <label for="horas_dia">
            Horas de uso por dia
        </label>

        <input
            type="number"
            id="horas_dia"
            name="horas_dia"
            min="0.1"
            max="24"
            step="0.1"
            placeholder="Ex: 8"
            required
        >

        <button type="submit">
            Adicionar equipamento
        </button>

    </form>

    <a
        class="voltar"
        href="{{ url_for(
            'residencia',
            residencia_id=residencia.id
        ) }}"
    >
        ← Voltar
    </a>

</div>

</body>

</html>
